services:
  postgres:
    image: postgres:15-alpine
    container_name: aqi-postgres
    environment:
      POSTGRES_DB: aqi_warehouse
      POSTGRES_USER: aqi_user
      POSTGRES_PASSWORD: aqi_pass_2024
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:z
      - ./sql/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqi_user -d aqi_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: aqi-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: aqi_warehouse
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: aqi_user
      MB_DB_PASS: aqi_pass_2024
      MB_SITE_NAME: "AQI Global Dashboard"
      MB_SITE_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
